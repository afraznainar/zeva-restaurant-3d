<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>ZEVA - Restaurant 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#e8ecef;
font-family:system-ui,-apple-system,Segoe UI,sans-serif;touch-action:none}
canvas{display:block}
#hud{position:fixed;top:12px;left:14px;font-size:12px;line-height:1.5;color:#2a2f36;opacity:.85;pointer-events:none}
#hud b{font-size:13px;letter-spacing:3px}
#ui{position:fixed;left:10px;right:10px;bottom:calc(12px + env(safe-area-inset-bottom,0px));
display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
button{background:#ffffffdd;color:#20252a;border:1px solid #0002;border-radius:18px;
padding:8px 13px;font-size:13px;backdrop-filter:blur(6px)}
</style></head>
<body onload="(function(){var a=document.createElement('script');a.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';a.onload=function(){var b=document.createElement('script');b.src='app.js';document.head.appendChild(b);};document.head.appendChild(a);})()">
<div id="hud"><b>ZEVA</b><br>drag to orbit &middot; scroll to zoom</div>
<div id="ui">
<button id="bCut">Cutaway</button>
<button id="bLab">Labels</button>
<button id="bTop">Top</button>
<button id="bSt">Street</button>
<button id="bIn">Interior</button>
<button id="bNi">Night</button>
</div>
</body></html>
